name: SLC commercial permit digest

on:
  schedule:
    # Daily at 13:48 UTC = 7:48am MDT / 6:48am MST.
    - cron: "48 13 * * *"
  workflow_dispatch:
    inputs:
      days_back:
        description: "Search records opened in the last N days"
        default: "14"
      building_types:
        description: "Building record types containing any of these (comma-separated; blank = all)"
        default: "Commercial,Commericial"
      planning_types:
        description: "Planning record types containing any of these (comma-separated; blank = all)"
        default: ""
      dry_run:
        description: "Dry run: list what would be added, without writing the sheet or marking anything seen"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: permit-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Search and summarize
        env:
          ACCELA_USERNAME: ${{ secrets.ACCELA_USERNAME }}
          ACCELA_PASSWORD: ${{ secrets.ACCELA_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DAYS_BACK: ${{ inputs.days_back || '14' }}
          # Scheduled runs have no inputs. SLC spells one type "Commericial Demolition".
          BUILDING_TYPES: ${{ github.event_name == 'schedule' && 'Commercial,Commericial' || inputs.building_types }}
          PLANNING_TYPES: ${{ github.event_name == 'schedule' && '' || inputs.planning_types }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--days-back "$DAYS_BACK" --modules Building,Planning
                --types "Building=$BUILDING_TYPES" --types "Planning=$PLANNING_TYPES")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run --no-details --no-summary); fi
          python -m slc_permits "${args[@]}"

      - name: Upload debug snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-snapshots
          path: debug/
          if-no-files-found: ignore

      - name: Commit report and seen-permit list
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ reports/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Permit digest $(TZ=America/Denver date +%F)"
            git push
          fi
