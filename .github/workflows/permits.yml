name: SLC commercial permit digest

on:
  schedule:
    # GitHub's scheduler is best-effort: runs can be late or dropped. So there are
    # backup attempts; each skips itself if that day's digest already ran.
    # UTC times = 5:47, 6:43 and 7:37am MDT (summer); 4:47, 5:43 and 6:37am MST (winter),
    # so all three are before 8am Mountain year-round.
    - cron: "47 11 * * *"
    - cron: "43 12 * * *"
    - cron: "37 13 * * *"
    # TEMPORARY test (remove once confirmed): checks whether GitHub fires this schedule at all. Testing
    # Each run skips itself because today's report already exists.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      days_back:
        description: "Search records opened in the last N days"
        default: "14"
      building_types:
        description: "Building record types containing any of these (comma-separated; blank = all)"
        default: "Commercial,Commericial"
      planning_types:
        description: "Planning record types containing any of these (comma-separated; blank = all)"
        default: ""
      planning_skip:
        description: "...except Planning types containing any of these (comma-separated; blank = skip none)"
        default: "Minor Alteration,Zoning Verification Letter"
      dry_run:
        description: "Dry run: list what would be added, without writing the sheet or marking anything seen"
        type: boolean
        default: false
      reclassify:
        description: "Re-rate importance of every permit already on record and update the sheet (no portal search)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: permit-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Skip if today's digest already ran
        id: guard
        if: github.event_name == 'schedule'
        run: |
          today=$(TZ=America/Denver date +%F)
          if [ -f "reports/$today.md" ]; then
            echo "Today's digest (reports/$today.md) already ran; skipping this backup attempt."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.guard.outputs.skip != 'true'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Search and summarize
        if: steps.guard.outputs.skip != 'true'
        env:
          ACCELA_USERNAME: ${{ secrets.ACCELA_USERNAME }}
          ACCELA_PASSWORD: ${{ secrets.ACCELA_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DAYS_BACK: ${{ inputs.days_back || '14' }}
          # Scheduled runs have no inputs. SLC spells one type "Commericial Demolition".
          BUILDING_TYPES: ${{ github.event_name == 'schedule' && 'Commercial,Commericial' || inputs.building_types }}
          PLANNING_TYPES: ${{ github.event_name == 'schedule' && '' || inputs.planning_types }}
          PLANNING_SKIP: ${{ github.event_name == 'schedule' && 'Minor Alteration,Zoning Verification Letter' || inputs.planning_skip }}
          DRY_RUN: ${{ inputs.dry_run }}
          RECLASSIFY: ${{ inputs.reclassify }}
        run: |
          args=(--days-back "$DAYS_BACK" --modules Building,Planning
                --types "Building=$BUILDING_TYPES" --types "Planning=$PLANNING_TYPES"
                --skip-types "Planning=$PLANNING_SKIP")
          if [ "$RECLASSIFY" = "true" ]; then
            args=(--reclassify); if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          elif [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run --no-details --no-summary)
          fi
          python -m slc_permits "${args[@]}"

      - name: Upload debug snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-snapshots
          path: debug/
          if-no-files-found: ignore

      - name: Commit report and seen-permit list
        if: ${{ !inputs.dry_run && steps.guard.outputs.skip != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ reports/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Permit digest $(TZ=America/Denver date +%F)"
            git push
          fi
